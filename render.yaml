databases:
  - name: jewellery-association-preview-db
    databaseName: jewellery_association_preview
    user: jewellery_association_preview

services:
  - type: web
    name: jewellery-association-api-preview
    env: python
    rootDir: backend
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health/
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: preview-api.yourdomain.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://admin.yourdomain.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://admin.yourdomain.com
      - key: MEDIA_STORAGE_PROVIDER
        value: r2
      - key: DATABASE_URL
        fromDatabase:
          name: jewellery-association-preview-db
          property: connectionString
      - key: MEDIA_PUBLIC_BUCKET_NAME
        sync: false
      - key: MEDIA_PRIVATE_BUCKET_NAME
        sync: false
      - key: MEDIA_PUBLIC_BASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_REGION
        value: auto
      - key: R2_ENDPOINT_URL
        sync: false
